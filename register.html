<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="Create an account – Codrive">Créer un compte – Codrive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <main class="auth-shell auth-shell-register">
    <section class="auth-panel wide">
      <div class="auth-card">
        <div class="auth-card-head">
          <h1 data-en="Create a Codrive account">Créer un compte Codrive</h1>
        </div>

        <form id="registerForm" class="stack-form form-grid">
          <div class="field">
            <label for="prenom" data-en="First name">Prénom</label>
            <input type="text" id="prenom" autocomplete="given-name" maxlength="255" required />
          </div>

          <div class="field">
            <label for="nom" data-en="Last name">Nom</label>
            <input type="text" id="nom" autocomplete="family-name" maxlength="255" required />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="exemple@mail.com" data-en-placeholder="example@mail.com" maxlength="255" required />
          </div>

          <div class="field">
            <label for="telephone" data-en="Phone number">Téléphone</label>
            <input type="tel" id="telephone" autocomplete="tel" maxlength="255" required />
          </div>

          <div class="field">
            <label for="password" data-en="Password">Mot de passe</label>
            <input type="password" id="password" autocomplete="new-password" minlength="8" maxlength="255"
              aria-describedby="passwordHelp" required />
            <small id="passwordHelp" class="muted" data-en="At least 8 characters.">Au moins 8 caractères.</small>
          </div>

          <div class="field">
            <label for="role" data-en="Role">Rôle</label>
            <select id="role" required>
              <option value="PASSAGER" data-en="Passenger">Passager</option>
              <option value="CHAUFFEUR" data-en="Driver">Chauffeur</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block form-grid-submit"><span class="material-icons" aria-hidden="true">person_add</span><span data-en="Create my account">Créer mon compte</span></button>
          <p id="authFeedback" class="form-feedback form-grid-submit" role="alert"></p>
        </form>

        <div class="auth-links">
          <span data-en="Already registered?">Déjà inscrit ?</span>
          <a href="login.html"><span class="material-icons" aria-hidden="true">login</span><span data-en="Sign in">Se connecter</span></a>
        </div>
      </div>
    </section>

    <section class="auth-brand">
      <strong class="auth-brand-title">Codrive</strong>
      <p data-en="Create a passenger account to book trips or a driver account to publish them.">Inscris-toi comme passager pour réserver un trajet ou comme chauffeur pour en publier.</p>
      <img class="auth-hero-image" src="images/carpool-login.png" alt="Voiture sur une route" data-en-alt="Car on a road" />
    </section>
  </main>

  <script src="config.js"></script>
  <script src="js/language.js"></script>
  <script src="js/api-messages.js"></script>
  <script src="js/auth-common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
